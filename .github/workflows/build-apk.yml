name: Build Android APK (Aura Finanzas)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutar la compilación manualmente con un solo clic en la pestaña Actions

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm install

      - name: ⚡ Compilar Web App (Vite)
        run: npm run build

      - name: ☕ Configurar Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: 🔑 Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: 🔨 Compilar APK Debug (Listo para instalar directamente en cualquier celular)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 🚀 Compilar APK Release
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Subir APK Debug como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: aura-finanzas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 📦 Subir APK Release como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: aura-finanzas-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
