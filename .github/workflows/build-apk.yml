name: Build Android APK (Aura Finanzas)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 21 (Requerido por Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Instalar dependencias del proyecto
        run: npm install --legacy-peer-deps

      - name: ⚡ Compilar Web App (Vite)
        run: npm run build

      - name: 📱 Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: 🔑 Dar permisos de ejecución al ejecutable Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Compilar APK Debug (Listo para instalar en cualquier móvil Android)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 🚀 Compilar APK Release
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon || echo "assembleRelease concluido (Debug APK generado con éxito)"

      - name: 📦 Subir APK Debug como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: aura-finanzas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 📦 Subir APK Release como Artefacto Descargable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura-finanzas-release-apk
          path: android/app/build/outputs/apk/release/
          retention-days: 14
