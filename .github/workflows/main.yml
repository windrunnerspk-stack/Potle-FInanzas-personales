name: Build and Create Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias web
        run: npm install --legacy-peer-deps

      - name: Compilar frontend Vite
        run: npm run build

      - name: Sincronizar Capacitor con iOS
        run: npx cap sync ios

      - name: Compilar proyecto Xcode (.xcarchive)
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/PotleFinanzas.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Empaquetar archivo .zip
        run: |
          cd $RUNNER_TEMP
          zip -r PotleFinanzas-iOS-Release.zip PotleFinanzas.xcarchive

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Potle Finanzas Release v1.0.${{ github.run_number }}
          body: |
            ## Versión oficial de Potle Finanzas
            - Compilación automatizada de la app iOS.
            - Descarga el archivo adjunto para distribuir o importar en Xcode.
          files: |
            ${{ runner.temp }}/PotleFinanzas-iOS-Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
